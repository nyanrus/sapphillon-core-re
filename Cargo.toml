[workspace]
members = [
    "proto",
    "ext_plugin",
    "sapphillon_deno_interface",
    "sapphillon_deno",
    "sapphillon_core",
]
resolver = "2"

[workspace.dependencies]
prost         = "0.13"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
indexmap      = { version = "2", features = ["serde"] }
thiserror     = "1"
tokio         = { version = "1", features = ["full"] }
url           = "2"
anyhow        = "1"
extism        = "1"
deno_core     = "0.311.0"
abi_stable    = "0.11"
