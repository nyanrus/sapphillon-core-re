[package]
name    = "sapphillon_core"
version = "0.1.0"
edition = "2021"

# All JS engine interaction goes through sapphillon_js_interface (stable ABI)
# and the sapphillon_js cdylib — no direct JS engine dependency here.

[dependencies]
abi_stable                = { workspace = true }
sapphillon_js_interface   = { path = "../sapphillon_js_interface" }
ext_plugin                = { path = "../ext_plugin" }
proto                     = { path = "../proto" }
serde                     = { workspace = true }
serde_json                = { workspace = true }
indexmap                  = { workspace = true }
thiserror                 = { workspace = true }
tokio                     = { workspace = true }
url                       = { workspace = true }
