[package]
name    = "sapphillon_core"
version = "0.1.0"
edition = "2021"

# deno_core is intentionally absent — all JS engine interaction goes through
# sapphillon_deno_interface (stable ABI) and the sapphillon_deno cdylib.

[dependencies]
abi_stable                  = { workspace = true }
sapphillon_deno_interface   = { path = "../sapphillon_deno_interface" }
ext_plugin                  = { path = "../ext_plugin" }
proto                       = { path = "../proto" }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
indexmap                    = { workspace = true }
thiserror                   = { workspace = true }
tokio                       = { workspace = true }
url                         = { workspace = true }
