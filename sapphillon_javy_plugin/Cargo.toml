# This directory is a JavaScript project, not a Rust crate.
# The JS plugin (plugin.js) is compiled to WASM using extism-js:
#
#   npm install -g @extism/js-pdk
#   extism-js plugin.js -o js_engine.wasm
#
# The resulting js_engine.wasm is embedded in sapphillon_js via include_bytes!.
# This file exists only to prevent cargo from treating this dir as an orphan crate.
#
# DO NOT add this to the workspace [members] list.
[package]
name    = "sapphillon_javy_plugin_placeholder"
version = "0.0.0"
edition = "2021"
publish = false
