# Build configuration for Sapphillon-re workspace.
#
# The GNU toolchain (x86_64-pc-windows-gnu) is used because MSVC build tools
# are not installed on this machine.  MinGW tools via MSYS2 provide the
# required linker and dlltool.
#
# After installing MSYS2 (winget install MSYS2.MSYS2) and running:
#   pacman -S mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
#
# Set default toolchain:
#   rustup default stable-x86_64-pc-windows-gnu

[target.x86_64-pc-windows-gnu]
linker  = "C:/msys64/mingw64/bin/gcc.exe"
ar      = "C:/msys64/mingw64/bin/ar.exe"

# dlltool is required for cdylib builds (sapphillon_js).
# Cargo automatically discovers it via PATH or target.*.dlltool below.
# Uncomment once MSYS2 is installed:
# [target.x86_64-pc-windows-gnu.dll]
# dlltool = "C:/msys64/mingw64/bin/dlltool.exe"
