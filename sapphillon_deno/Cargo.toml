[package]
name    = "sapphillon_deno"
version = "0.1.0"
edition = "2021"

# Both cdylib (for dynamic loading) and rlib (for integration tests that want
# to link directly without a filesystem path).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deno_core                   = { workspace = true }
abi_stable                  = { workspace = true }
sapphillon_deno_interface   = { path = "../sapphillon_deno_interface" }
serde_json                  = { workspace = true }
anyhow                      = { workspace = true }
tokio                       = { workspace = true }
